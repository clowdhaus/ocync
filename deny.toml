[advisories]
version = 2
ignore = [
  # Unmaintained, no known vulnerability. serde_yaml_ng parses the config through it, and every
  # serde_yaml fork does the same.
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; config parsing depends on it" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
private = { ignore = true }

[bans]
multiple-versions = "deny"
deny = [
  { crate = "native-tls", wrappers = [] },
  { crate = "openssl", wrappers = [] },
  { crate = "openssl-sys", wrappers = [] },
  { crate = "ring", wrappers = [] },
  # Pure-Rust hashes and a ChaCha20 generator sit outside the FIPS module.
  # Only the testcontainers dev dependency may pull the generator.
  { crate = "sha2", wrappers = [] },
  { crate = "hmac", wrappers = [] },
  { crate = "chacha20", wrappers = ["rand"] },
  { crate = "rand", wrappers = ["bollard", "ferroid"] },
]
# Transitive duplicates from AWS SDK + testcontainers ecosystem version splits.
# These are unavoidable until upstream unifies major versions.
skip = [
  { crate = "core-foundation@0.9" },  # system-configuration (hyper-util) vs security-framework
  { crate = "syn@2" },                # async-stream / aws-smithy macros (syn 2) vs serde/clap/schemars derives (syn 3)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
