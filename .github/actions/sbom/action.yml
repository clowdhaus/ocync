name: Bill of materials
description: >-
  Write the CycloneDX bill of materials for an ocync binary or image with syft
  and tools/sbom and, for a binary, attest it. Needs rustup on PATH.

inputs:
  subject:
    description: Binary path, or a local image reference for an image
    required: true
  kind:
    description: binary or image
    required: true
  crypto:
    description: AWS-LC build the binary must link (fips or non-fips)
    required: true
  attest:
    description: attest or skip; attesting a binary needs id-token and attestations write
    required: false
    default: skip
  vex:
    description: write or skip the OpenVEX document for grype's matches on crates the binary does not contain
    required: false
    default: skip

outputs:
  path:
    description: Path to the finished CycloneDX JSON document
    value: ${{ steps.finish.outputs.path }}
  vex:
    description: Path to the OpenVEX document, empty when no statement applies
    value: ${{ steps.finish.outputs.vex }}

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      with:
        tool: syft@1.55.0

    - if: inputs.vex == 'write'
      id: grype
      uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        grype-version: v0.121.0
        cache-db: true

    - id: finish
      shell: bash
      env:
        SUBJECT: ${{ inputs.subject }}
        KIND: ${{ inputs.kind }}
        CRYPTO: ${{ inputs.crypto }}
        GRYPE: ${{ steps.grype.outputs.cmd }}
      run: |
        set -euo pipefail
        case "$KIND" in
          binary)
            source="file:$SUBJECT"
            binary="$SUBJECT"
            path="$SUBJECT.cdx.json"
            ;;
          image)
            source="docker:$SUBJECT"
            binary="$RUNNER_TEMP/ocync-from-image"
            container="$(docker create "$SUBJECT")"
            docker cp "$container:/usr/local/bin/ocync" "$binary"
            docker rm "$container" > /dev/null
            path="image-$(docker image inspect --format '{{.Architecture}}' "$SUBJECT").cdx.json"
            ;;
          *) echo "::error::kind must be binary or image, got $KIND"; exit 1 ;;
        esac
        raw="$RUNNER_TEMP/$(basename "$path").raw"
        syft scan "$source" --output "cyclonedx-json=$raw"
        vex_args=()
        vex="${path%.cdx.json}.vex.json"
        if [ -n "$GRYPE" ]; then
          "$GRYPE" "sbom:$raw" --output json --file "$raw.grype"
          vex_args=(--grype "$raw.grype" --vex "$vex")
        fi
        cargo run --locked --quiet -p sbom -- \
          --crypto "$CRYPTO" --binary "$binary" --raw "$raw" --out "$path" "${vex_args[@]}"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        if [ -f "$vex" ]; then echo "vex=$vex" >> "$GITHUB_OUTPUT"; fi

    - if: inputs.kind == 'binary' && inputs.attest == 'attest'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ inputs.subject }}
        sbom-path: ${{ steps.finish.outputs.path }}

    - if: inputs.kind == 'binary' && inputs.attest == 'attest' && steps.finish.outputs.vex != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ inputs.subject }}
        predicate-type: https://openvex.dev/ns/v0.2.0
        predicate-path: ${{ steps.finish.outputs.vex }}
